<mat-toolbar color="accent">
  <mat-toolbar-row>
    <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="sidenav.toggle()" color="primary"
      class="mat-icon-button sidenav-toggle-button">
      <mat-icon aria-label="Side nav toggle icon" *ngIf="!sidenav.opened; else showCross">menu</mat-icon>
      <ng-template #showCross>
        <mat-icon aria-label="Side nav toggle icon">close</mat-icon>
      </ng-template>
    </button>
    {{title}}
  </mat-toolbar-row>
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav #sidenav mode="push" [fixedInViewport]="true" fixedTopGap="64">
    <mat-nav-list>
      <mat-list-item>
        <mat-icon matListIcon>dashboard</mat-icon>
        <p>Dashboard</p>
      </mat-list-item>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <main [@fadeAnimation]="getRouterOutletState(o)">
      <router-outlet #o="outlet"></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
