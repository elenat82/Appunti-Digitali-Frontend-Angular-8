<div class="article-container">
    <article>
        <ngx-simplebar [options]="options">
            <mat-card>
                <mat-card-header>
                    <mat-card-subtitle>
                        <h3>
                        <div [ngSwitch]="content?.tipo">
                            <i *ngSwitchCase="'Html'" class="icon-app-html5"></i>
                            <i *ngSwitchCase="'Css'" class="icon-app-css3"></i>
                            <i *ngSwitchCase="'Javascript'" class="icon-app-javascript"></i>
                            <i *ngSwitchCase="'Angular'" class="icon-app-angular"></i>
                            <i *ngSwitchCase="'Drupal'" class="icon-app-drupal"></i>
                            <i *ngSwitchCase="'Php'" class="icon-app-php"></i>
                            <i *ngSwitchCase="'Varie'" class="icon-app-heart"></i>
                        {{content?.tipo}}
                        </div>
                    </h3>
                    </mat-card-subtitle>
                    <mat-card-title><h2>{{content?.titolo}}</h2></mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <div class="content-container">
                        <div [innerHTML]="content?.body | safe: 'html'"></div>
                    </div>
                </mat-card-content>
                <mat-card-footer>
                    <div class="tags">
                        <ul>
                            <li>
                                <i class="icon-app-price-tags"></i>
                            </li>
                            <ng-container *ngIf="content?.tagsgenerici">
                                <li *ngFor="let t of content.tagsgenerici">
                                    <a>{{t.title}}</a>
                                </li>
                            </ng-container>
                            <ng-container *ngIf="content?.tagshtml">
                                <li *ngFor="let t of content.tagshtml">
                                    <a>{{t.title}}</a>
                                </li>
                            </ng-container>
                            <ng-container *ngIf="content?.tagscss">
                                <li *ngFor="let t of content.tagscss">
                                    <a>{{t.title}}</a>
                                </li>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsjs">
                                <li *ngFor="let t of content.tagsjs">
                                    <a>{{t.title}}</a>
                                </li>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsangular">
                                <li *ngFor="let t of content.tagsangular">
                                    <a>{{t.title}}</a>
                                </li>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsphp">
                                <li *ngFor="let t of content.tagsphp">
                                    <a>{{t.title}}</a>
                                </li>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsdrupal">
                                <li *ngFor="let t of content.tagsdrupal">
                                    <a>{{t.title}}</a>
                                </li>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsvarie">
                                <li *ngFor="let t of content.tagsvarie">
                                    <a>{{t.title}}</a>
                                </li>
                            </ng-container>
                        </ul>
                    </div>
                </mat-card-footer>
            </mat-card>
        </ngx-simplebar>
    </article>
    <aside>
        <mat-nav-list>
            <h3 matSubheader class="mat-subheading-2">Approfondimenti</h3>
            <mat-list-item *ngFor="let appr of content?.approfondimenti">
                <a matLine href="{{appr.url}}" target="_blank" rel="no-opener"><i [ngClass]="appr.icon"></i>{{ appr.text }}</a>
            </mat-list-item>
            <mat-divider></mat-divider>
            <h3 matSubheader class="mat-subheading-2">Correlati</h3>
            <mat-list-item *ngFor="let corr of content?.correlati">
                <a matLine href="{{corr.url}}">{{ corr.text }}</a>
            </mat-list-item>
        </mat-nav-list>
    </aside>
</div>
