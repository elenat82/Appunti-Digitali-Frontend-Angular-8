<div class="article-container">
    <article [ngClass]="{
        'showAsideOnTheRight': showAsideOnTheRight,
        'showAsideOnTheBottom': !showAsideOnTheRight
      }">
        <ngx-simplebar [options]="options">
            <mat-card>
                <mat-card-header>
                    <mat-card-subtitle>
                        <h3>
                            <div [ngSwitch]="content?.tipo">
                                <i *ngSwitchCase="'Html'" class="icon-app-html5"></i>
                                <i *ngSwitchCase="'Css'" class="icon-app-css3"></i>
                                <i *ngSwitchCase="'Javascript'" class="icon-app-javascript"></i>
                                <i *ngSwitchCase="'Angular'" class="icon-app-angular"></i>
                                <i *ngSwitchCase="'Drupal'" class="icon-app-drupal"></i>
                                <i *ngSwitchCase="'Php'" class="icon-app-php"></i>
                                <i *ngSwitchCase="'Varie'" class="icon-app-heart"></i>
                                {{content?.tipo}}
                            </div>
                        </h3>
                    </mat-card-subtitle>
                    <mat-card-title>
                        <h2>{{content?.titolo}}</h2>
                    </mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <div class="content-container">
                        <div [innerHTML]="content?.body | safe: 'html'"></div>
                    </div>
                    <aside *ngIf="!showAsideOnTheRight" class="showAsideOnTheBottom">
                        <mat-nav-list>
                            <h3 matSubheader class="mat-subheading-2">Approfondimenti</h3>
                            <mat-list-item *ngFor="let appr of content?.approfondimenti">
                                <a matLine href="{{appr.url}}" target="_blank" rel="no-opener"><i
                                        [ngClass]="appr.icon"></i>{{ appr.text }}</a>
                            </mat-list-item>
                            <ng-container *ngIf="content?.correlati.length">
                                <mat-divider></mat-divider>
                                <h3 matSubheader class="mat-subheading-2">Correlati</h3>
                                <mat-list-item *ngFor="let corr of content?.correlati">
                                    <a matLine href="{{corr.url}}">{{ corr.text }}</a>
                                </mat-list-item>
                            </ng-container>
                        </mat-nav-list>
                    </aside>
                </mat-card-content>
                <mat-card-footer>
                    <div class="tags">
                        <mat-chip-list>
                            <mat-chip disabled class="tags-icon-chip">
                                <i class="icon-app-price-tags"></i>
                            </mat-chip>
                            <ng-container *ngIf="content?.tagsgenerici">
                                <mat-chip disabled *ngFor="let t of content.tagsgenerici">
                                    <a>{{t.title}}</a>
                                </mat-chip>
                            </ng-container>
                            <ng-container *ngIf="content?.tagshtml">
                                <mat-chip disabled *ngFor="let t of content.tagshtml">
                                    <a>{{t.title}}</a>
                                </mat-chip>
                            </ng-container>
                            <ng-container *ngIf="content?.tagscss">
                                <mat-chip disabled *ngFor="let t of content.tagscss">
                                    <a>{{t.title}}</a>
                                </mat-chip>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsjs">
                                <mat-chip disabled *ngFor="let t of content.tagsjs">
                                    <a>{{t.title}}</a>
                                </mat-chip>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsangular">
                                <mat-chip disabled *ngFor="let t of content.tagsangular">
                                    <a>{{t.title}}</a>
                                </mat-chip>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsphp">
                                <mat-chip disabled *ngFor="let t of content.tagsphp">
                                    <a>{{t.title}}</a>
                                </mat-chip>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsdrupal">
                                <mat-chip disabled *ngFor="let t of content.tagsdrupal">
                                    <a>{{t.title}}</a>
                                </mat-chip>
                            </ng-container>
                            <ng-container *ngIf="content?.tagsvarie">
                                <mat-chip disabled *ngFor="let t of content.tagsvarie">
                                    <a>{{t.title}}</a>
                                </mat-chip>
                            </ng-container>
                        </mat-chip-list>
                    </div>
                </mat-card-footer>
            </mat-card>
        </ngx-simplebar>
    </article>
    <aside *ngIf="showAsideOnTheRight" class="showAsideOnTheRight">
        <mat-nav-list>
            <h3 matSubheader class="mat-subheading-2">Approfondimenti</h3>
            <mat-list-item *ngFor="let appr of content?.approfondimenti">
                <a matLine href="{{appr.url}}" target="_blank" rel="no-opener"><i
                        [ngClass]="appr.icon"></i>{{ appr.text }}</a>
            </mat-list-item>
            <ng-container *ngIf="content?.correlati.length">
                <mat-divider></mat-divider>
                <h3 matSubheader class="mat-subheading-2">Correlati</h3>
                <mat-list-item *ngFor="let corr of content?.correlati">
                    <a matLine href="{{corr.url}}">{{ corr.text }}</a>
                </mat-list-item>
            </ng-container>
        </mat-nav-list>
    </aside>
</div>
