<div class="logo-container">
  <img src="assets/img/logo.svg">
</div>
<mat-form-field>
  <mat-label>Cerca</mat-label>
  <input matInput type="text" [(ngModel)]="query">
  <button mat-button *ngIf="query" matSuffix mat-icon-button aria-label="Clear" (click)="query=''">
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>

<mat-nav-list>
  <h3 matSubheader>Html</h3>
  <mat-list-item *ngFor="let voice of menuVoices?.html  | filterlist : query">
    <a matLine [routerLink]="['/content', voice.id]">{{ voice.titolo }}</a>
  </mat-list-item>
  <mat-divider></mat-divider>
  <h3 matSubheader>Css</h3>
  <mat-list-item *ngFor="let voice of menuVoices?.css  | filterlist : query">
    <a matLine [routerLink]="['/content', voice.id]">{{ voice.titolo }}</a>
  </mat-list-item>
  <mat-divider></mat-divider>
  <h3 matSubheader>Javascript</h3>
  <mat-list-item *ngFor="let voice of menuVoices?.js  | filterlist : query">
    <a matLine [routerLink]="['/content', voice.id]">{{ voice.titolo }}</a>
  </mat-list-item>
  <mat-divider></mat-divider>
  <h3 matSubheader>Angular</h3>
  <mat-list-item *ngFor="let voice of menuVoices?.angular  | filterlist : query">
    <a matLine [routerLink]="['/content', voice.id]">{{ voice.titolo }}</a>
  </mat-list-item>
  <mat-divider></mat-divider>
  <h3 matSubheader>Php</h3>
  <mat-list-item *ngFor="let voice of menuVoices?.php  | filterlist : query">
    <a matLine [routerLink]="['/content', voice.id]">{{ voice.titolo }}</a>
  </mat-list-item>
  <mat-divider></mat-divider>
  <h3 matSubheader>Drupal</h3>
  <mat-list-item *ngFor="let voice of menuVoices?.drupal  | filterlist : query">

  <mat-divider></mat-divider>
  <h3 matSubheader>Varie</h3>
  <mat-list-item *ngFor="let voice of menuVoices?.varie  | filterlist : query">

  </mat-list-item>
</mat-nav-list>
