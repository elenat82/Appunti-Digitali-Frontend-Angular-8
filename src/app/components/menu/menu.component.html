<mat-form-field >
  <mat-label>Cerca</mat-label>
  <input matInput type="text" [(ngModel)]="query">
  <button mat-button *ngIf="query" matSuffix mat-icon-button aria-label="Clear" (click)="query=''">
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>
<mat-nav-list>
  <mat-list-item *ngFor="let voice of menuVoices  | async  | filterlist : query">
     <a matLine [routerLink]="['/content', voice.id]">{{ voice.titolo }}</a>
  </mat-list-item>
</mat-nav-list>
