<a [routerLink]="['/home']" class="link-to-home">
  <div class="logo-container">
    <img src="assets/img/logo.svg" title="Appunti Digitali | Gli appunti di una Front End Developer">
  </div>
</a>
<mat-form-field id="cerca-menu" appearance="fill">
  <mat-label>Cerca...</mat-label>
  <input matInput type="text" [(ngModel)]="query">
  <button mat-button *ngIf="query" matSuffix mat-icon-button aria-label="Clear" (click)="query=''">
    <mat-icon>close</mat-icon>
  </button>
  <span matPrefix><i class="icon-app-search"></i></span>
</mat-form-field>
<ngx-simplebar [options]="simplebarOptions">
  <div class="menu-wrapper">
    <mat-nav-list>
      <h3  class="mat-display-3"><i class="icon-app-html5"></i>Html</h3>
      <mat-list-item *ngFor="let voice of menuHtml  | filterlist : query; trackBy : trackByFunc"
        [routerLink]="['/appunti', voice.tipo.toLowerCase(),voice.slug]" routerLinkActive="active-menu">
        <a matLine>{{ voice.titolo }}</a>
      </mat-list-item>
      <mat-divider></mat-divider>
      <h3  class="mat-display-3"><i class="icon-app-css3"></i>Css</h3>
      <mat-list-item *ngFor="let voice of menuCss  | filterlist : query; trackBy : trackByFunc"
        [routerLink]="['/appunti', voice.tipo.toLowerCase(),voice.slug]" routerLinkActive="active-menu">
        <a matLine>{{ voice.titolo }}</a>
      </mat-list-item>
      <mat-divider></mat-divider>
      <h3  class="mat-display-3"><i class="icon-app-javascript"></i>Javascript</h3>
      <mat-list-item *ngFor="let voice of menuJS  | filterlist : query; trackBy : trackByFunc"
        [routerLink]="['/appunti', voice.tipo.toLowerCase(), voice.slug]" routerLinkActive="active-menu">
        <a matLine>{{ voice.titolo }}</a>
      </mat-list-item>
      <ng-container *ngIf="menuAngular?.length">
      <mat-divider></mat-divider>
      <h3  class="mat-display-3"><i class="icon-app-angular"></i>Angular</h3>
      <mat-list-item *ngFor="let voice of menuAngular  | filterlist : query; trackBy : trackByFunc"
        [routerLink]="['/appunti', voice.tipo.toLowerCase(),voice.slug]" routerLinkActive="active-menu">
        <a matLine>{{ voice.titolo }}</a>
      </mat-list-item>
    </ng-container>
      <ng-container *ngIf="menuPhp?.length">
        <mat-divider></mat-divider>
        <h3  class="mat-display-3"><i class="icon-app-php"></i>Php</h3>
        <mat-list-item *ngFor="let voice of menuPhp  | filterlist : query; trackBy : trackByFunc"
          [routerLink]="['/appunti', voice.tipo.toLowerCase(),voice.slug]" routerLinkActive="active-menu">
          <a matLine>{{ voice.titolo }}</a>
        </mat-list-item>
      </ng-container>
      <ng-container *ngIf="menuDrupal?.length">
        <mat-divider></mat-divider>
        <h3  class="mat-display-3"><i class="icon-app-drupal"></i>Drupal</h3>
        <mat-list-item *ngFor="let voice of menuDrupal  | filterlist : query; trackBy : trackByFunc"
          [routerLink]="['/appunti', voice.tipo.toLowerCase(),voice.slug]" routerLinkActive="active-menu">
          <a matLine>{{ voice.titolo }}</a>
        </mat-list-item>
      </ng-container>
      <mat-divider></mat-divider>
      <h3  class="mat-display-3"><i class="icon-app-heart"></i>Varie</h3>
      <mat-list-item *ngFor="let voice of menuVarie  | filterlist : query; trackBy : trackByFunc"
        [routerLink]="['/appunti', voice.tipo.toLowerCase(),voice.slug]" routerLinkActive="active-menu">
        <a matLine>{{ voice.titolo }}</a>
      </mat-list-item>
    </mat-nav-list>
  </div>
</ngx-simplebar>
