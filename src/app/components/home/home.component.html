<div class="container">
  <form [formGroup]="contentForm">
    <mat-form-field>
      <input type="text" matInput placeholder="Cerca..." formControlName="query" [matAutocomplete]="autoGroup">
      <button mat-button matSuffix mat-icon-button aria-label="Clear" (click)="contentForm.get('query').reset()">
        <mat-icon>close</mat-icon>
      </button>
      <mat-autocomplete #autoGroup="matAutocomplete" (optionSelected)="selected($event)" [displayWith]="getOptionText">
        <mat-optgroup *ngFor="let group of materieOptions | async" [label]="group.materia">
          <mat-option *ngFor="let articolo of group.articoli" [value]="articolo">
            {{articolo.titolo}}
          </mat-option>
        </mat-optgroup>
      </mat-autocomplete>
    </mat-form-field>
  </form>
</div>
